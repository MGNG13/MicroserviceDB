[package]
name = "json-db-server"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
warp = { version = "0.3", features = ["tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures = "0.3"
regex = "1"
rand = "0.8"
mongodb = "3"
redis = { version = "0.27", features = ["tokio-comp"] }
dashmap = "6.0"
chrono = { version = "0.4", features = ["clock"] }
flate2 = "1"
dotenvy = "0.15"
local-ip-address = "0.6"