    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --port 27018 --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  # ============================================================
  # SHARD 3 - 3 NODE REPLICA SET
  # ============================================================
  shard3a:
    <<: *mongo-shard
    container_name: shard3a
    hostname: shard3a
    command:
      - mongod
      - --shardsvr
      - --replSet
      - shard3RS
      - --port
      - "27018"
      - --bind_ip_all
      - --wiredTigerCacheSizeGB
      - "${MONGO_CACHE_GB:-2}"
    ports:
      - "27103:27018"
    volumes:
      - shard3a:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --port 27018 --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  shard3b:
    <<: *mongo-shard
    container_name: shard3b
    hostname: shard3b
    command:
      - mongod
      - --shardsvr
      - --replSet
      - shard3RS
      - --port
      - "27018"
      - --bind_ip_all
      - --wiredTigerCacheSizeGB
      - "${MONGO_CACHE_GB:-2}"
    volumes:
      - shard3b:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --port 27018 --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  shard3c:
    <<: *mongo-shard
    container_name: shard3c
    hostname: shard3c
    command:
      - mongod
      - --shardsvr
      - --replSet
      - shard3RS
      - --port
      - "27018"
      - --bind_ip_all
      - --wiredTigerCacheSizeGB
      - "${MONGO_CACHE_GB:-2}"
    volumes:
      - shard3c:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --port 27018 --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  # ============================================================
  # MONGOS ROUTERS - 2 INSTANCES
  # ============================================================
  mongos1:
    image: mongo:8.0
    container_name: mongos1
    hostname: mongos1
    restart: unless-stopped
    init: true
    mem_limit: 1g
    cpus: "1.5"
    ulimits:
      nofile:
        soft: 64000
        hard: 64000
    command:
      - mongos
      - --configdb
      - configRS/config1:27019,config2:27019,config3:27019
      - --bind_ip_all
      - --port
      - "27017"
    ports:
      - "27017:27017"
    depends_on:
      config1:
        condition: service_healthy
      config2:
        condition: service_healthy
      config3:
        condition: service_healthy
    networks:
      - mongo-cluster
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --port 27017 --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
  mongos2:
    image: mongo:8.0
    container_name: mongos2
    hostname: mongos2
    restart: unless-stopped
    init: true
    mem_limit: 1g
    cpus: "1.5"
    ulimits:
      nofile:
        soft: 64000
        hard: 64000
    command:
      - mongos
      - --configdb
      - configRS/config1:27019,config2:27019,config3:27019
      - --bind_ip_all
      - --port
      - "27017"
    ports:
      - "27020:27017"
    depends_on:
      config1:
        condition: service_healthy
      config2:
        condition: service_healthy
      config3:
        condition: service_healthy
    networks:
      - mongo-cluster
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --port 27017 --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
  # ============================================================
  # DRAGONFLY - CACHE ÚNICO
  # Sin réplica: al estar en el mismo servidor físico no aporta
  # nada — solo consume el doble de RAM y CPU.
  #
  # Flags de cache:
  #   --dbnum=1             una sola base de datos (db 0); SELECT > 0 retorna error
  #   --cache_mode          LRU eviction al alcanzar maxmemory
  #   --maxmemory           límite interno; debe ser < mem_limit del
  #                         contenedor para dejar headroom al proceso
  #   --snapshot_cron=      deshabilita snapshots — cache puro,
  #                         sin I/O de escritura a disco
  #   --proactor_threads    un hilo por vCPU asignado
  #   --tcp_keepalive       detecta conexiones muertas rápidamente
  # ============================================================
  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    container_name: dragonfly
    hostname: dragonfly
    restart: unless-stopped
    mem_limit: ${DRAGONFLY_MEM_LIMIT:-8g}
    cpus: "${DRAGONFLY_CPUS:-4.0}"
    command:
      - --dbnum=1
      - --cache_mode
      - --maxmemory=${DRAGONFLY_MAXMEMORY:-7gb}
      - --proactor_threads=${DRAGONFLY_THREADS:-4}
      - --snapshot_cron=
      - --tcp_keepalive=60
    ports:
      - "6379:6379"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    networks:
      - mongo-cluster
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 6379 ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
# ==============================================================
# VOLUMES
# Dragonfly no tiene volumen: cache puro sin persistencia.
# Si necesitas warm restart agrega: dragonfly: y monta /data.
# ==============================================================
volumes:
  config1:
  config2:
  config3:
  shard1a:
  shard1b:
  shard1c:
  shard2a:
  shard2b:
  shard2c:
  shard3a:
  shard3b:
  shard3c:
# ==============================================================
# NETWORK
# ==============================================================
networks:
  mongo-cluster:
    driver: bridge