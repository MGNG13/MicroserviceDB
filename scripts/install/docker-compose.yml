x-mongo-shard: &mongo-shard
  image: mongo:8.0
  restart: unless-stopped
  init: true
  mem_limit: ${MONGO_MEM_LIMIT:-4g}
  cpus: "${MONGO_CPUS:-2.0}"
  ulimits:
    nofile:
      soft: 64000
      hard: 64000
  networks:
    - mongo-cluster
  stop_grace_period: 60s
x-mongo-config: &mongo-config
  image: mongo:8.0
  restart: unless-stopped
  init: true
  mem_limit: 1g
  cpus: "1.0"
  ulimits:
    nofile:
      soft: 32000
      hard: 32000
  networks:
    - mongo-cluster
  stop_grace_period: 60s
services:
  # ============================================================
  # CONFIG SERVER REPLICA SET - 3 NODES
  # ============================================================
  config1:
    <<: *mongo-config
    container_name: config1
    hostname: config1
    command:
      - mongod
      - --configsvr
      - --replSet
      - configRS
      - --port
      - "27019"
      - --bind_ip_all
      - --wiredTigerCacheSizeGB
      - "0.5"
    volumes:
      - config1:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --port 27019 --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
  config2:
    <<: *mongo-config
    container_name: config2
    hostname: config2
    command:
      - mongod
      - --configsvr
      - --replSet
      - configRS
      - --port
      - "27019"
      - --bind_ip_all
      - --wiredTigerCacheSizeGB
      - "0.5"
    volumes:
      - config2:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --port 27019 --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
  config3:
    <<: *mongo-config
    container_name: config3
    hostname: config3
    command:
      - mongod
      - --configsvr
      - --replSet
      - configRS
      - --port
      - "27019"
      - --bind_ip_all
      - --wiredTigerCacheSizeGB
      - "0.5"
    volumes:
      - config3:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --port 27019 --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
  # ============================================================
  # SHARD 1 - 3 NODE REPLICA SET
  # ============================================================
  shard1a:
    <<: *mongo-shard
    container_name: shard1a
    hostname: shard1a
    command:
      - mongod
      - --shardsvr
      - --replSet
      - shard1RS
      - --port
      - "27018"
      - --bind_ip_all
      - --wiredTigerCacheSizeGB
      - "${MONGO_CACHE_GB:-2}"
    ports:
      - "27101:27018"
    volumes:
      - shard1a:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --port 27018 --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  shard1b:
    <<: *mongo-shard
    container_name: shard1b
    hostname: shard1b
    command:
      - mongod
      - --shardsvr
      - --replSet
      - shard1RS
      - --port
      - "27018"
      - --bind_ip_all
      - --wiredTigerCacheSizeGB
      - "${MONGO_CACHE_GB:-2}"
    volumes:
      - shard1b:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --port 27018 --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  shard1c:
    <<: *mongo-shard
    container_name: shard1c
    hostname: shard1c
    command:
      - mongod
      - --shardsvr
      - --replSet
