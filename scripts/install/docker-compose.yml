      timeout: 5s
      retries: 12
      start_period: 30s
  # ============================================================
  # SHARD 2 - 3 NODE REPLICA SET
  # ============================================================
  shard2a:
    <<: *mongo-shard
    container_name: shard2a
    hostname: shard2a
    command:
      - mongod
      - --shardsvr
      - --replSet
      - shard2RS
      - --port
      - "27018"
      - --bind_ip_all
      - --wiredTigerCacheSizeGB
      - "${MONGO_CACHE_GB:-2}"
    ports:
      - "27102:27018"
    volumes:
      - shard2a:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --port 27018 --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  shard2b:
    <<: *mongo-shard
    container_name: shard2b
    hostname: shard2b
    command:
      - mongod
      - --shardsvr
      - --replSet
      - shard2RS
      - --port
      - "27018"
      - --bind_ip_all
      - --wiredTigerCacheSizeGB
      - "${MONGO_CACHE_GB:-2}"
    volumes:
      - shard2b:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --port 27018 --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  shard2c:
    <<: *mongo-shard
    container_name: shard2c
    hostname: shard2c
    command:
      - mongod
      - --shardsvr
      - --replSet
      - shard2RS
      - --port
      - "27018"
      - --bind_ip_all
      - --wiredTigerCacheSizeGB
      - "${MONGO_CACHE_GB:-2}"
    volumes:
