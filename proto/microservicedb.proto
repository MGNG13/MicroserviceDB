syntax = "proto3";

package microservicedb;

service DatabaseService {
    rpc Action(ActionRequest) returns (ActionResponse);
    rpc StreamChanges(StreamChangesRequest) returns (stream ChangeEvent);
    // Descarga progresiva de una colección: lotes de documentos según se leen de MongoDB.
    rpc ExportCollectionStream(ExportCollectionRequest) returns (stream DocumentBatch);
}

message ActionRequest {
    string msg_type      = 1;
    string category      = 2;
    string function_name = 3;
    string payload_json  = 4;
    string request_id    = 5;
}

message ActionResponse {
    bool   success        = 1;
    string response_json  = 2;
    string message        = 3;
    string request_id     = 4;
}

message StreamChangesRequest {
    string database_name   = 1;
    string collection_name = 2;
    bool   include_system  = 3;
}

message ChangeEvent {
    string event           = 1;
    string category        = 2;
    string database_name   = 3;
    string collection_name = 4;
    string event_json      = 5;
    int64  ts_ms           = 6;
}

message ExportCollectionRequest {
    string database_name   = 1;
    string collection_name = 2;
    string filter_json     = 3;
    uint32 batch_size      = 4;
}

message DocumentBatch {
    string documents_json = 1; // arreglo JSON de documentos
    uint64 total          = 2; // documentos que coinciden con el filtro
    uint64 sent           = 3; // documentos enviados hasta este lote, incluido
}
